name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Obsolete pull-request heads are cancelled; a running main validation always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: The product identity has not reverted
      run: python3 scripts/brand.py --check
    - name: No server configuration is committed
      run: |
        set -euo pipefail
        python3 scripts/configure.py --check | tee /tmp/configured.txt
        if ! grep -qx 'RENDEZVOUS_SERVERS = &\[\]' /tmp/configured.txt; then
          echo "a rendezvous server is compiled into this repository" >&2
          exit 1
        fi
        if ! grep -qx 'RS_PUB_KEY         = (empty)' /tmp/configured.txt; then
          echo "a server public key is compiled into this repository" >&2
          exit 1
        fi
    - name: The wire protocol still matches the server
      run: python3 scripts/check_protocol_parity.py
    - name: The commitlint exemption is not wider than stated
      run: node scripts/check_commitlint_config.mjs
    - name: The build and analysis toolchains agree
      run: |
        set -euo pipefail
        for key in RUST_VERSION CARGO_EXPAND_VERSION FLUTTER_RUST_BRIDGE_VERSION; do
          build=$(grep -E "^  ${key}: " .github/workflows/build.yml | head -1)
          ui=$(grep -E "^  ${key}: " .github/workflows/ui.yml | head -1)
          if [ -z "${build}" ] || [ -z "${ui}" ]; then
            echo "${key} is missing from one of the two workflows" >&2
            exit 1
          fi
          if [ "${build}" != "${ui}" ]; then
            echo "${key} differs: build.yml has '${build}', ui.yml has '${ui}'" >&2
            exit 1
          fi
        done
        echo "build.yml and ui.yml agree on the pinned toolchain"
  shared-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Select the Rust toolchain
      run: |
        rustup toolchain install stable --profile minimal --component clippy,rustfmt
        echo RUSTUP_TOOLCHAIN=stable >> "$GITHUB_ENV"
    - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/hosted-cache@ab62f45b2a3067e5a7425d703f7fd07f1618b72c # nddev-cicd-v0.6.14
      with:
        ecosystems: cargo
        working-directory: libs/hbb_common
    - name: Build
      shell: bash
      run: |
        cargo build --locked --all-targets
      working-directory: libs/hbb_common
    - name: Test
      shell: bash
      run: |
        cargo test --locked --all-targets
      working-directory: libs/hbb_common
  shared-library-platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-26
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Select the Rust toolchain
      run: |
        rustup toolchain install stable --profile minimal
        echo RUSTUP_TOOLCHAIN=stable >> "$GITHUB_ENV"
    - name: Test
      shell: bash
      run: |
        cargo test --locked --all-targets
      working-directory: libs/hbb_common

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@ab62f45b2a3067e5a7425d703f7fd07f1618b72c # nddev-cicd-v0.6.14
        with:
          capability: security
      - name: Lint and audit workflows
        run: |
          actionlint
          zizmor --offline --no-progress .github/workflows/ci.yml .github/workflows/build.yml .github/workflows/ui.yml .github/workflows/security.yml .github/dependabot.yml
      - name: Scan new pull request commits, or the full history on main
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            gitleaks git --no-banner --redact --log-opts="$BASE..$HEAD" .
          else
            gitleaks git --no-banner --redact .
          fi

