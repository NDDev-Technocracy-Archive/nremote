name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Prepare the public CI job
        id: setup
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          managed: 'false'
          fetch-depth: 1
      - name: Check the local source contracts
        id: local
        run: just check-contracts
      - name: Verify both halves of the pinned wire protocol
        id: project
        run: just check-protocol
      - name: Complete the public CI job
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.setup.outcome == 'success' && contains(steps.*.outcome, 'failure') && 'failure' || steps.project.outcome }}
          task: contracts
          name: contracts
          read-token: ${{ steps.setup.outputs.read-token }}

  shared-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Prepare the public CI job
        id: setup
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          managed: 'false'
          fetch-depth: 1
          working-directory: libs/hbb_common
      - name: Select the existing shared-library Rust toolchain
        id: compiler
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          echo RUSTUP_TOOLCHAIN=stable >> "$GITHUB_ENV"
      - name: Build every existing library target
        id: build
        run: just build-shared
      - name: Test every existing library target
        id: project
        run: just test-shared
      - name: Complete the public CI job
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.setup.outcome == 'success' && contains(steps.*.outcome, 'failure') && 'failure' || steps.project.outcome }}
          task: shared-library
          name: shared-library
          read-token: ${{ steps.setup.outputs.read-token }}

  shared-library-platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare the public CI job
        id: setup
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          managed: 'false'
          fetch-depth: 1
          working-directory: libs/hbb_common
      - name: Select the existing shared-library Rust toolchain
        id: compiler
        run: |
          rustup toolchain install stable --profile minimal
          echo RUSTUP_TOOLCHAIN=stable >> "$GITHUB_ENV"
      - name: Test every existing library target
        id: project
        run: just test-shared
      - name: Complete the public CI job
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.setup.outcome == 'success' && contains(steps.*.outcome, 'failure') && 'failure' || steps.project.outcome }}
          task: shared-library-macos
          name: shared-library-macos
          read-token: ${{ steps.setup.outputs.read-token }}

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Prepare the public CI job
        id: setup
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          managed: 'false'
          fetch-depth: 0
          tools: zizmor@1.32.0,shellcheck@0.11.0
          tool-assets: .github/ci-tools.json
      - name: Check workflows, shell and the complete Git history
        id: project
        run: just check-ci
      - name: Complete the public CI job
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.setup.outcome == 'success' && contains(steps.*.outcome, 'failure') && 'failure' || steps.project.outcome }}
          task: workflows
          name: workflows
          read-token: ${{ steps.setup.outputs.read-token }}

  merge-stops:
    if: github.event_name == 'pull_request'
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
    permissions:
      contents: read

  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [contracts, shared-library, shared-library-platforms, workflows, merge-stops]
    permissions: {}
    steps:
      - name: Require every actual producer and only the declared event skips
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED: >-
            {"contracts":"success","shared-library":"success","shared-library-platforms":"${{ github.event_name != 'pull_request' && 'success' || 'skipped' }}","workflows":"success","merge-stops":"${{ github.event_name == 'pull_request' && 'success' || 'skipped' }}"}
        run: jq -e --argjson want "$EXPECTED" 'map_values(.result) == $want' <<< "$NEEDS"
